<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        :root {
            font-family: Arial, Helvetica, sans-serif;
            color: black;
            background-color: white;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

        }

        #logo {
            width: 80px;
        }

        .main {
            display: grid;
            grid-template-columns: minmax(0, 57%) minmax(0, 43%);
        }

        .left {
            padding: 30px 40px;
            border-right: 2px solid grey;
        }

        .girl {
            width: 480px;
        }

        .content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .explore {
            font-size: 4vw;
            font-weight: 600;
            margin-top: 200px;
        }

        .blue {
            color: blue;
        }
    </style>
</head>

<body>
    <div class="main">
        <section class="left">
            <img src="./assests/logo.png" alt="logo" id="logo">

            <div class="content">
                <h1 class="explore">Explore the things <span class="blue">you love</span>.</h1>

                <img src="./assests/home.png" alt="" class="girl">


            </div>
        </section>

        <section class="right">

            <form>
                <h3>Log in to Facebook
                </h3>

                <input type="email" placeholder="enter your email addres">
                <input type="password" placeholder="enter your password">

                <button class="btn">Log in</button>
                <a href="./forgetPassword.html">Forgetten password</a>

                <button class="btn">Create new Account</button>

                <div>
                    <img src="./assests/meta.png" alt="meta">
                    Meta
                </div>


            </form>

        </section>
    </div>
</body>

</html>
